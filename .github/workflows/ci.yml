name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  map-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported version but is no longer installable on
        # the hosted runner; it is checked locally against macOS's system Python.
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pytest-cov
      - run: python -m pytest --cov=skills/codeatlas/scripts --cov-fail-under=80
        working-directory: plugins/codeatlas
      - name: The repository's own map still matches its code
        run: python plugins/codeatlas/skills/codeatlas/scripts/codeatlas.py refresh

  viewer-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed viewer bundles match the sources
        run: git diff --exit-code -- plugins/codeatlas/skills/codeatlas/assets
      - name: Extension tests inside VS Code
        run: xvfb-run -a npx vscode-test
        working-directory: extension
      - name: The extension packages
        run: npx vsce package --no-dependencies
        working-directory: extension
